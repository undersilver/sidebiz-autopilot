name: Revalidate revised drafts
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: sidebiz-content-writes
  cancel-in-progress: false
jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Revalidate revised drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/revalidate_revised.py
      - name: Save validation
        run: |
          git config user.name "sidebiz-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet || git commit -m "Revalidate revised drafts"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
