name: Revise from issue comment
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: sidebiz-content-writes
  cancel-in-progress: false
jobs:
  revise:
    if: github.actor == github.repository_owner && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/revise')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt
      - name: Apply revision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/revise_from_comment.py
      - name: Rebuild thumbnail
        run: python scripts/generate_thumbnails.py
      - name: Commit revision
        run: |
          git config user.name "sidebiz-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts docs/assets/thumbnails
          git diff --cached --quiet || git commit -m "Revise draft from issue comment"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
