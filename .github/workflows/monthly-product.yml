name: Monthly product manuscript
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/create_monthly_manuscript.py"
      - ".github/workflows/monthly-product.yml"
  schedule:
    - cron: "0 8 1 * *"
      timezone: "Asia/Tokyo"
permissions:
  contents: write
  issues: write
concurrency:
  group: sidebiz-content-writes
  cancel-in-progress: false
jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Create monthly manuscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_monthly_manuscript.py
      - name: Commit manuscript
        run: |
          git config user.name "sidebiz-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add products
          git diff --cached --quiet || git commit -m "Create monthly product manuscript"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
