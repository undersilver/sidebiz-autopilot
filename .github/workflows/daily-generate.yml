name: Daily content generation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  issues: write
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-content-generation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Create labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_labels.py

      - name: Generate one review item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_daily.py

      - name: Save draft
        run: |
          git config user.name "sidebiz-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet || git commit -m "Generate daily review draft"
          git push
