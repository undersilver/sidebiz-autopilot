name: Daily content generation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"
permissions:
  contents: write
  issues: write
concurrency:
  group: sidebiz-content-writes
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt
      - name: Create labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_labels.py
      - name: Generate and validate one review item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_TIER_ONLY: "true"
        run: python scripts/generate_daily.py
      - name: Generate branded thumbnail
        run: python scripts/generate_thumbnails.py
      - name: Save draft and thumbnail
        run: |
          git config user.name "sidebiz-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts data docs/assets/thumbnails
          git diff --cached --quiet || git commit -m "Generate validated daily content"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
